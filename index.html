<style>

  #boot{position:fixed;inset:0;z-index:100;background:#000;color:var(--green);
    padding:6vh 6vw;font-size:14px;line-height:1.7;overflow:hidden;transition:opacity .8s}
  #boot .ok{color:var(--green-dim)} #boot .warn{color:var(--amber)}
  #boot h1{margin-top:24px;font-size:clamp(20px,4vw,42px);letter-spacing:4px;
    text-shadow:0 0 18px var(--green);animation:flicker 1.4s infinite}
  @keyframes flicker{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.4}94%{opacity:1}97%{opacity:.7}98%{opacity:1}}
  #boot.done{opacity:0;pointer-events:none}
  main{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:34px 16px 90px}
  .term{background:rgba(6,12,9,.92);border:1px solid var(--border);border-radius:10px;
    box-shadow:0 0 40px rgba(0,230,118,.08),0 20px 60px rgba(0,0,0,.7);
    backdrop-filter:blur(3px);overflow:hidden}
  .bar{display:flex;align-items:center;gap:8px;padding:10px 14px;
    background:linear-gradient(180deg,#0d1a12,#091209);border-bottom:1px solid var(--border)}
  .dot{width:12px;height:12px;border-radius:50%}
  .dot.r{background:#ff5f56}.dot.y{background:#ffbd2e}.dot.g{background:#27c93f}
  .bar .title{margin-left:8px;color:var(--muted);font-size:13px}
  .bar .sig{margin-left:auto;color:var(--green-dim);font-size:12px}
  .screen{padding:18px 18px 24px;font-size:14.5px;line-height:1.65;min-height:55vh}
  .screen a{color:var(--green);text-decoration:none;border-bottom:1px dotted var(--green-dim)}
  .screen a:hover{background:var(--green-dark)}
  .p{color:var(--green);text-shadow:0 0 8px rgba(0,230,118,.6)}
  .cmd{color:#fff}
  .out{color:var(--text);white-space:pre-wrap;word-break:break-word}
  .dim{color:var(--muted)} .hl{color:var(--green)} .warn{color:var(--amber)}
  .cursor{display:inline-block;width:9px;height:17px;background:var(--green);
    vertical-align:-3px;animation:blink 1s steps(1) infinite;box-shadow:0 0 10px var(--green)}
  @keyframes blink{50%{opacity:0}}
  .inline{display:flex;gap:0;align-items:baseline}
  .inline input{flex:1;background:none;border:none;outline:none;color:#fff;
    font:inherit;caret-color:transparent}
  footer{position:relative;z-index:1;text-align:center;color:var(--green-dim);
    font-size:12.5px;padding:26px 10px;letter-spacing:1px}
  footer a{color:var(--muted);text-decoration:none}
  ::selection{background:var(--green-dark);color:#fff}

/* ================= MATRIX RAIN ================= */
(()=>{
  const cv=document.getElementById('rain'),cx=cv.getContext('2d');
  const glyphs='アイウエオカキクケコサシスセソ0123456789ABCDEF<>/\\{}$#*+=';
  let cols,drops,fs=16;
  function size(){cv.width=innerWidth;cv.height=innerHeight;
    cols=Math.floor(cv.width/fs);drops=Array(cols).fill(0).map(()=>Math.random()*-100);}
  size();addEventListener('resize',size);
  setInterval(()=>{
    cx.fillStyle='rgba(5,5,5,.09)';cx.fillRect(0,0,cv.width,cv.height);
    cx.font=fs+'px monospace';
    drops.forEach((y,i)=>{
      const ch=glyphs[Math.random()*glyphs.length|0];
      const x=i*fs;
      cx.fillStyle=Math.random()>.975?'#d0ffe0':'#00b86b';
      cx.fillText(ch,x,y*fs);
      if(y*fs>cv.height&&Math.random()>.976)drops[i]=0;
      drops[i]++;
    });
  },55);
})();

const screen=document.getElementById('screen');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const scrollEnd=()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});

async function typeCmd(cmd){
  const line=document.createElement('div');
  line.className='inline';
  line.innerHTML='<span class="p">mustafa@ak:~$ </span><span class="cmd"></span><span class="cursor"></span>';
  screen.appendChild(line);
  const span=line.querySelector('.cmd');
  for(const ch of cmd){span.textContent+=ch;await sleep(38);scrollEnd();}
  await sleep(160);
  line.querySelector('.cursor').remove();
}

function out(html,cls='out'){
  const d=document.createElement('div');
  d.className=cls; d.innerHTML=html;
  screen.appendChild(d); scrollEnd();
}

/* ---- scripted intro ---- */
async function startTerm(){
  SECTIONS.banner();
  await sleep(500);
  for(const c of ['help','whoami','skills','projects']){
    await typeCmd(c); await sleep(120); SECTIONS[c](); await sleep(420);
  }
  await typeCmd('contact'); SECTIONS.contact();
  promptInput();
}

/* ---- interactive prompt ---- */
function promptInput(){
  const line=document.createElement('div');
  line.className='inline';
  line.innerHTML='<span class="p">mustafa@ak:~$ </span><input autocomplete="off" spellcheck="false" autofocus><span class="cursor"></span>';
  screen.appendChild(line);
  const input=line.querySelector('input');
  input.focus(); scrollEnd();
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      const v=input.value.trim().toLowerCase();
      line.innerHTML='<span class="p">mustafa@ak:~$ </span><span class="cmd">'+v.replace(/</g,'&lt;')+'</span>';
      if(v){ if(SECTIONS[v]) SECTIONS[v](); else out(`<span class="warn">command not found: ${v.replace(/</g,'&lt;')}</span> — try <span class="hl">help</span>`);}
      promptInput();
    }
  });
}

/* click anywhere focuses input */
document.addEventListener('click',()=>{const i=screen.querySelector('input');if(i&&getSelection().toString()==='')i.focus();});
